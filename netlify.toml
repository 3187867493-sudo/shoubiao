[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/renovation/analyze"
  to = "/.netlify/functions/renovation-analyze-background"
  status = 200

[[redirects]]
  from = "/api/renovation/analysis-status"
  to = "/.netlify/functions/renovation-analysis-status"
  status = 200

[[redirects]]
  from = "/api/renovation/generate"
  to = "/.netlify/functions/renovation-generate"
  status = 200

[[redirects]]
  from = "/api/renovation/status"
  to = "/.netlify/functions/renovation-status"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
