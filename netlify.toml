[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/city/analyze"
  to = "/.netlify/functions/renovation-analyze-background"
  status = 200

[[redirects]]
  from = "/api/city/analysis-status"
  to = "/.netlify/functions/renovation-analysis-status"
  status = 200

[[redirects]]
  from = "/api/city/generate"
  to = "/.netlify/functions/renovation-generate"
  status = 200

[[redirects]]
  from = "/api/city/status"
  to = "/.netlify/functions/renovation-status"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

